[project]
name = "llm-gateway"
version = "0.2.0"
description = "分层 LLM Gateway：多供应商路由（优先级/加权）、统一重试、L1-L4 失败分类、SQLite 用量账本、鉴权限流与 OpenAI 兼容接口"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.30",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
